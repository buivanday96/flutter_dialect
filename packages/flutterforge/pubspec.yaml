name: flutterforge
description: >-
  Gives AI coding agents your Flutter project's conventions over MCP, and
  generates OpenAPI models and repositories in your project's own style.
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.9.0
topics: [flutter, mcp, ai, codegen, openapi]
executables:
  flutterforge: flutterforge
  flutterforge_mcp: flutterforge_mcp
dependencies:
  args: ^2.6.0
  dart_mcp: ^0.5.2
  flutterforge_core: ^0.1.0
  path: ^1.9.0
dev_dependencies:
  test: ^1.25.0
