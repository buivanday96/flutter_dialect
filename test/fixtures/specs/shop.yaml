openapi: 3.0.3
info:
  title: Shop
  version: 1.0.0
paths:
  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - {name: page, in: query, schema: {type: integer}}
        - {name: size, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ProductStatus'}}
        - {name: q, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Product'}}
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: {type: string}
                price: {type: number}
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
  /products/{productId}:
    parameters:
      - {name: productId, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getProduct
      tags: [products]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
    delete:
      operationId: deleteProduct
      tags: [products]
      responses:
        '204': {description: deleted}
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Order'}}
    post:
      operationId: placeOrder
      tags: [orders]
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewOrder'}
      responses:
        '201':
          description: placed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
  /orders/{orderId}/status:
    put:
      operationId: updateOrderStatus
      tags: [orders]
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: string}}
        - {name: X-Request-Id, in: header, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/OrderStatus'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
  /orders/{orderId}/payment:
    get:
      operationId: getPayment
      tags: [orders]
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: card or invoice
          content:
            application/json:
              schema:
                oneOf:
                  - {type: object, properties: {card: {type: string}}}
                  - {type: object, properties: {invoice: {type: string}}}
components:
  schemas:
    ProductStatus:
      type: string
      enum: [available, sold_out, discontinued]
    Product:
      type: object
      description: A product in the catalog.
      required: [id, name, price, createdAt]
      properties:
        id: {type: integer}
        name: {type: string}
        price: {type: number}
        tags: {type: array, items: {type: string}}
        status: {$ref: '#/components/schemas/ProductStatus'}
        category: {$ref: '#/components/schemas/Category'}
        dimensions:
          type: object
          properties:
            width: {type: number}
            height: {type: number}
        createdAt: {type: string, format: date-time}
        metadata: {type: object, additionalProperties: true}
    Category:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string, description: Display name.}
        parent_id: {type: integer, nullable: true}
    OrderStatus:
      type: string
      enum: [pending, paid, in-transit, new, 2fa_required]
    OrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: {type: integer}
        quantity: {type: integer}
    Order:
      type: object
      required: [id, items, status]
      properties:
        id: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        status: {$ref: '#/components/schemas/OrderStatus'}
        note: {type: string}
        placedAt: {type: string, format: date-time}
        class: {type: string}
    NewOrder:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        note: {type: string}
